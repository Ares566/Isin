[package]
name = "isin"
version = "0.1.0"
edition = "2021"

[dependencies]
whisper-rs = "0.16"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
rdev = "0.5"
toml = "0.8"
regex = "1"
