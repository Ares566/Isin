# Исин — конфигурация

[whisper]
# Термины для улучшения распознавания whisper (initial_prompt).
vocabulary = ["YouTrack", "JetBrains", "Jira", "Notion", "Slack"]

# Фоллбэк-скилл: если ни один триггер не сработал — текст в буфер обмена.
[[skill]]
name = "clipboard"
triggers = []
action = "clipboard"

